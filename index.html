<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="shortcut icon" href="img/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <title>Gerar TA</title>
</head>
<body>
    <form action="/gerar-ta" method="post">
        <h1>Gerar TA</h1>
        <select required name="plataforma" id="plataforma">
            <option value="">Escolha uma plataforma...</option>
            <option value="op">OpenMEI</option>
            <option value="oc">OpenCON</option>
            <option value="am">AgileMEI</option>
            <option value="im">IdeiaMEI</option>
        </select>
        <label for="name">Nome:</label>
        <input type="text" id="name" name="name" required placeholder="Nome da Empresa">
        <br>
        <label for="dominio">Domínio:</label>
        <input type="text" id="dominio" name="dominio" required placeholder="Dominio sem .com.br">
        <br>
        <label for="razaosocial">Razão Social:</label>
        <input type="text" id="razaosocial" name="razaosocial" required placeholder="Razão Social">
        <br>
        <label for="cnpj">CNPJ:</label>
        <input type="text" id="cnpj" name="cnpj" required placeholder="00.000.000/0000-00">
        <br>
        <label for="rua">Rua e Número:</label>
        <input type="text" id="rua" name="rua" required placeholder="Avenida Vicente Machado, 503">
        <br>
        <label for="cidade">Cidade e Estado:</label>
        <input type="text" id="cidade" name="cidade" required placeholder="Curitiba/PR">
        <br>
        <label for="cidade" class="politica-privacidade">URL Política de Privacidade:</label>
        <button type="button" class="btn-copy" onclick="copiar('politica-privacidade')"><i class="fa-regular fa-copy"></i></button>
        <input type="text" id="politica-privacidade" name="politica-privacidade" readonly placeholder="URL da Política de Privacidade">
        <br>
        <label for="termos-uso" class="termos-uso">URL Termos de Uso:</label>
        <button type="button" class="btn-copy" onclick="copiar('termos-uso')"><i class="fa-regular fa-copy"></i></button>
        <input type="text" id="termos-uso" name="termos-uso" readonly placeholder="URL dos Termos de Uso">
        <br>
        <button id="gerar-ta" type="button">Gerar TA</button>
    </form>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="js/script.js"></script>
</body>
